<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460"><rect width="1100" height="460" fill="#0d1117"/><rect x="20" y="20" width="1060" height="420" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/><circle cx="46" cy="46" r="6" fill="#ff5f56"/><circle cx="66" cy="46" r="6" fill="#ffbd2e"/><circle cx="86" cy="46" r="6" fill="#27c93f"/><text x="46" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#3fb950">keycloak-cli clients list --first 2</tspan></text><text x="46" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">id   </tspan><tspan fill="#8b949e">clientId   </tspan><tspan fill="#8b949e">enabled</tspan></text><text x="46" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#c9d1d9">c-1  </tspan><tspan fill="#c9d1d9">web        </tspan><tspan fill="#3fb950">true</tspan></text><text x="46" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#c9d1d9">c-2  </tspan><tspan fill="#c9d1d9">api        </tspan><tspan fill="#f85149">false</tspan></text><text x="46" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"></text><text x="46" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#3fb950">keycloak-cli --dry-run users delete abc</tspan></text><text x="46" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#d29922">DELETE </tspan><tspan fill="#c9d1d9">http://localhost:8080/admin/realms/master/users/abc</tspan></text><text x="46" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"></text><text x="46" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#3fb950">keycloak-cli users delete abc</tspan></text><text x="46" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#f85149">error: users delete deletes data: pass </tspan><tspan fill="#c9d1d9">--yes</tspan><tspan fill="#f85149"> to confirm</tspan></text><text x="46" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"></text><text x="46" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#3fb950">keycloak-cli users list --search ali</tspan></text><text x="46" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" xml:space="preserve"><tspan fill="#3fb950">alice    </tspan><tspan fill="#3fb950">alicia   </tspan><tspan fill="#3fb950">alina</tspan></text></svg>
