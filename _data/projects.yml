# Curated catalog for /projects/.
#
# `benefit` is the point: what changes for someone who starts using it. Keep the
# list short — this is a signpost, not an inventory.

- name: keycloak-cli
  group: Keycloak and identity
  tagline: Every Keycloak admin operation as a command, generated from the crate.
  benefit: >-
    No more curl with a token you fetched by hand. Log in once per terminal and the
    password stays there; TAB completes your realms, users, groups and clients;
    output is a table, JSON, YAML, markdown or HTML; `--dry-run` shows the request
    before anything happens and deletes need `--yes`.
  audience: anyone scripting Keycloak instead of clicking through the admin console.
  repo: https://github.com/rust-utility/keycloak-cli
  crate: https://crates.io/crates/keycloak-cli
  page: /keycloak-cli/
  install: curl -fsSL https://raw.githubusercontent.com/rust-utility/keycloak-cli/main/install.sh | sh

- name: keycloak
  group: Keycloak and identity
  tagline: The Keycloak Admin API as typed Rust.
  benefit: >-
    All 415 admin operations, generated from Keycloak's own description for the
    release you pin, so the client cannot quietly fall behind the server. Turn on
    only the resource groups you use and the rest never compiles.
  audience: Rust services that administer realms, users, clients and roles.
  repo: https://github.com/kilork/keycloak
  crate: https://crates.io/crates/keycloak
  page: /keycloak/
  install: cargo add keycloak

- name: openid
  group: Keycloak and identity
  tagline: Log users in with any OpenID provider, without adopting a web framework.
  benefit: >-
    Discovery, the authorization-code flow with PKCE, token validation against the
    provider's keys and userinfo — functions you call from the handlers you already
    have. Google, Keycloak, Azure AD and Okta all work the same way.
  audience: Rust services that need real login.
  repo: https://github.com/kilork/openid
  crate: https://crates.io/crates/openid
  page: /openid/
  install: cargo add openid

- name: xfs-doctor
  group: Recovery and forensics
  tagline: Read-only rescue tools for XFS images that will not mount.
  benefit: >-
    Inspect headers at any offset, work out a RAID0 half-image's geometry, salvage
    directories without mounting anything, and carve files by signature when the
    metadata is gone. It never writes to the image and does not need the array.
  audience: anyone with a NAS that stopped mounting and data they still want.
  repo: https://github.com/rust-utility/xfs-doctor
  crate: https://crates.io/crates/xfs-doctor
  page: /xfs-doctor/
  install: cargo install xfs-doctor

- name: hg-git-fast-import
  group: Recovery and forensics
  tagline: Move Mercurial history into Git, including the awkward parts.
  benefit: >-
    One Mercurial repository or many into a single Git repository, through
    fast-import, keeping tags and closed branches. Re-run it to pick up new
    revisions, and check the result with a diff before you trust it.
  audience: people leaving Mercurial without leaving their history behind.
  repo: https://github.com/kilork/hg-git-fast-import
  crate: https://crates.io/crates/hg-git-fast-import
  page: /hg-git-fast-import/
  install: cargo install hg-git-fast-import

- name: git-site-clone
  group: Everyday tools
  tagline: Paste a repo URL and it lands where you keep code.
  benefit: >-
    Configure a base directory once, and `git-site-clone https://github.com/user/repo`
    checks out into `base/github.com/user/repo` — no mkdir dance. Mappings let a
    host point somewhere else, and it can take the URL from the clipboard.
  audience: people with a tidy ~/src tree and no patience for manual clones.
  repo: https://github.com/rust-application/git-site-clone
  crate: https://crates.io/crates/git-site-clone
  page: /git-site-clone/
  install: cargo install git-site-clone

- name: handlebars-magic
  group: Everyday tools
  tagline: One folder of handlebars templates, one rendered folder.
  benefit: >-
    Documentation, reports and configs from the same data: each template in the
    input directory produces the matching file in the output directory, with the
    usual handlebars helpers.
  audience: people who generate files instead of editing them.
  repo: https://github.com/rust-utility/handlebars-magic
  crate: https://crates.io/crates/handlebars-magic
  page: /handlebars-magic/
  install: cargo install handlebars-magic

- name: dm-mono-nerd-font
  group: Everyday tools
  tagline: DM Mono with the glyphs your terminal expects.
  benefit: >-
    Nerd Font icons, Cyrillic, arrows and box drawing, all at the same width, so
    prompt themes and file managers stop rendering boxes. Ships as release archives
    and a Homebrew tap.
  audience: people who like DM Mono and live in a terminal.
  repo: https://github.com/kilork/dm-mono-nerd-font
  page: /dm-mono-nerd-font/

- name: path-matchers
  group: Rust building blocks
  tagline: Glob and path matching you can combine.
  benefit: >-
    One small trait over plain paths and glob expressions, so your code filters
    paths without growing its own matcher — and two matchers can be combined.
  audience: library authors who keep writing path filtering.
  repo: https://github.com/rust-utility/path-matchers
  crate: https://crates.io/crates/path-matchers
  page: /path-matchers/
  install: cargo add path-matchers

- name: change-detection
  group: Rust building blocks
  tagline: Tell Cargo exactly what your build script depends on.
  benefit: >-
    Generates the rerun-if-changed instructions for your static inputs, so a build
    re-runs when something actually changed and stays incremental when nothing did.
  audience: build tooling and anything with a build script.
  repo: https://github.com/rust-utility/change-detection
  crate: https://crates.io/crates/change-detection
  page: /change-detection/
  install: cargo add change-detection

- name: cmake-parser
  group: Rust building blocks
  tagline: Read CMakeLists.txt as data.
  benefit: >-
    Parses CMake files (language 3.26) into structures you can inspect and
    transform, instead of pulling your hair out with regular expressions.
  audience: tools that read or migrate C and C++ builds.
  repo: https://github.com/rust-utility/cmake-parser
  crate: https://crates.io/crates/cmake-parser
  page: /cmake-parser/
  install: cargo add cmake-parser

- name: rust-libxml
  group: Rust building blocks
  tagline: Use libxml2 from Rust when exact behaviour matters.
  benefit: >-
    Wraps libxml2 without hiding it: Rust ownership, automatic deallocation, and
    the parser behaviour your documents were already written against.
  audience: Rust programs that cannot afford a different XML parser.
  repo: https://github.com/kilork/rust-libxml
  page: /rust-libxml/
